# Supabase 무료 요금제는 7일간 DB 사용이 적으면 프로젝트를 일시정지해요.
# Supabase 안의 예약 작업(pg_cron)과 별개로, 바깥(GitHub)에서 매일 한 번 깨워 줘요.
# 부르는 곳: 체험(심사·데모) 모드가 쓰는 읽기 전용 요청 → 실제 DB 조회가 일어나고,
# 체험 모드가 정상인지도 같이 확인돼요. 실패하면 GitHub이 메일로 알려 줘요.
#
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름 SUPABASE_ANON_KEY, 값은 .env 의 VITE_SUPABASE_ANON_KEY 와 같은 값
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 9 * * *' # 매일 18:00 (한국 시간)
  workflow_dispatch: {} # Actions 탭에서 손으로도 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (체험 모드 공고 조회)
        env:
          SUPABASE_URL: https://dzzkhxrlvlakaduaeyxj.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY 시크릿이 없어요. 저장소 설정에서 추가해 주세요."
            exit 1
          fi
          if ! body=$(curl -sS --fail-with-body --retry 3 --retry-delay 20 --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/functions/v1/report?type=demo"); then
            echo "::error::Supabase 요청이 실패했어요. 401이면 SUPABASE_ANON_KEY 값이 틀린 거예요. 프로젝트가 일시정지됐으면 대시보드에서 Resume 해 주세요."
            echo "$body" | head -c 500
            exit 1
          fi
          count=$(echo "$body" | jq '.cases | length // 0')
          echo "체험 모드 후보 수: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::응답은 왔지만 체험 모드 후보가 0개예요. 공고 받기(daily)가 멈췄는지 확인해 주세요."
            echo "$body" | head -c 500
            exit 1
          fi
